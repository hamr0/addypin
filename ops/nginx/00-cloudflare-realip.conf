# Restore the real client IP from Cloudflare's CF-Connecting-IP header.
# Cloudflare terminates TLS at its edge and re-originates to this box, so
# $remote_addr is a CF edge IP, not the visitor. Without this, every per-IP
# rate-limit bucket in addypin (and in knowless) is shared by every visitor
# routed through the same CF colo -- see PRD 8.
#
# set_real_ip_from is scoped to Cloudflare's published ranges ONLY. That is
# what makes the header trustworthy: a client hitting the origin directly,
# bypassing CF, is not in these ranges, so its forged CF-Connecting-IP is
# ignored and $remote_addr stays its true socket address.
#
# Ranges from https://www.cloudflare.com/ips-v4 + ips-v6, fetched 2026-07-14.
# CF changes these rarely; re-check if origin logs start showing CF IPs again.

set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;

set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;

real_ip_header CF-Connecting-IP;

# --- Origin lock (added 2026-07-14) ---------------------------------------
# Is this request actually arriving FROM Cloudflare? Keyed on
# $realip_remote_addr = the original TCP peer, BEFORE real_ip swapped in the
# true visitor. ($remote_addr is the visitor by now and cannot answer this.)
# Empty (no realip substitution happened => peer was not trusted) hits the
# default and is treated as NOT-from-CF, which is the fail-closed direction.
geo $realip_remote_addr $addypin_cf_peer {
    default 0;
    173.245.48.0/20 1;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    141.101.64.0/18 1;
    108.162.192.0/18 1;
    190.93.240.0/20 1;
    188.114.96.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    162.158.0.0/15 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    172.64.0.0/13 1;
    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
}
